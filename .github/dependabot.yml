# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# updates the SHA and the "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new action release waits a week before it's proposed, so a hijacked
    # release is usually caught and pulled before it reaches this gate.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
