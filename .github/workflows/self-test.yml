# malguard's own CI: the scanner's tests, then the scanner run on this repo
# through the action exactly as projects run it.
name: self-test

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  scan-self:
    name: malguard (this repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan this repo with the action at this commit
        uses: ./
