# Copy to .github/workflows/malguard.yml in a project.
#
# Runs the malguard gate on every pull request, every push to any branch,
# and once a day (a dependency can be declared malicious after it was
# merged). Make the check "malguard / malguard" required on the protected
# branches, and add the same job to every deploy workflow with the deploy
# jobs depending on it (see README.md, "Gate your deploys").
name: malguard

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malguard:
    uses: Marvellous-is-cool/malguard/.github/workflows/scan.yml@v1
